logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: <your-db-host>
  port: 3306
  user: <your-db-user>
  password: <your-db-password>
  database: meta

db_dw:
  host: <your-db-host>
  port: 3306
  user: <your-db-user>
  password: <your-db-password>
  database: dw

qdrant:
  host: <your-qdrant-host>
  port: 6333
  embedding_size: 1024

embedding:
  host: <your-embedding-host>
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: <your-es-host>
  port: 9200
  index_name: data_agent

llm:
  model_name: deepseek-flash
  api_key: <your-llm-api-key>
